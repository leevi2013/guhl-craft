
name: Build Fabric Mod

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build on Java 21
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Locate project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          if [ -f build.gradle ] && [ -d src/main/java ]; then
            PROJECT_DIR="."
          elif [ -f RagzanUtility/build.gradle ] && [ -d RagzanUtility/src/main/java ]; then
            PROJECT_DIR="RagzanUtility"
          else
            echo "Fehler: build.gradle oder src/main/java wurde nicht gefunden." >&2
            exit 1
          fi
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Apply Minecraft 1.21.11 source fixes
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail
          mkdir -p "$PROJECT_DIR/src/main/java/de/ragzan/utility/render"
          mkdir -p "$PROJECT_DIR/src/main/java/de/ragzan/utility/mixin"

          cat > "$PROJECT_DIR/src/main/java/de/ragzan/utility/render/EspRenderer.java" <<'JAVA'
          package de.ragzan.utility.render;

          import com.mojang.blaze3d.pipeline.RenderPipeline;
          import com.mojang.blaze3d.platform.DepthTestFunction;
          import com.mojang.blaze3d.vertex.VertexFormat;
          import de.ragzan.utility.ClientLogic;
          import de.ragzan.utility.config.ModConfig;
          import de.ragzan.utility.mixin.RenderLayerAccessor;
          import de.ragzan.utility.mixin.RenderPipelinesAccessor;
          import net.fabricmc.fabric.api.client.rendering.v1.world.WorldRenderContext;
          import net.fabricmc.fabric.api.client.rendering.v1.world.WorldRenderEvents;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.render.RenderLayer;
          import net.minecraft.client.render.RenderSetup;
          import net.minecraft.client.render.VertexConsumer;
          import net.minecraft.client.render.VertexConsumerProvider;
          import net.minecraft.client.render.VertexFormats;
          import net.minecraft.client.util.math.MatrixStack;
          import net.minecraft.entity.player.PlayerEntity;
          import net.minecraft.util.Identifier;
          import net.minecraft.util.math.BlockPos;
          import net.minecraft.util.math.Box;
          import net.minecraft.util.math.Vec3d;

          public final class EspRenderer {
              private static RenderLayer X_RAY_LINES;
              private static final ModConfig C = ModConfig.INSTANCE;

              private EspRenderer() {}

              public static void initialize() {
                  RenderPipeline pipeline = RenderPipeline.builder(
                          RenderPipelinesAccessor.ragzan$linesSnippet())
                          .withLocation(Identifier.of(
                                  "ragzan_utility", "pipeline/xray_lines"))
                          .withDepthTestFunction(DepthTestFunction.NO_DEPTH_TEST)
                          .withDepthWrite(false)
                          .withCull(false)
                          .withVertexFormat(
                                  VertexFormats.POSITION_COLOR_LINE_WIDTH,
                                  VertexFormat.DrawMode.LINES)
                          .build();

                  pipeline = RenderPipelinesAccessor.ragzan$register(pipeline);

                  X_RAY_LINES = RenderLayerAccessor.ragzan$create(
                          "ragzan_utility_xray_lines",
                          RenderSetup.builder(pipeline)
                                  .expectedBufferSize(4096)
                                  .build());

                  WorldRenderEvents.BEFORE_DEBUG_RENDER.register(
                          EspRenderer::render);
              }

              private static void render(WorldRenderContext context) {
                  MinecraftClient client = MinecraftClient.getInstance();

                  if (client.player == null
                          || client.world == null
                          || X_RAY_LINES == null) {
                      return;
                  }

                  if (!C.playerEsp && !C.blockEsp && !C.stashEsp) {
                      return;
                  }

                  MatrixStack matrices = context.matrices();
                  Vec3d camera = client.gameRenderer.getCamera().getCameraPos();

                  matrices.push();
                  matrices.translate(-camera.x, -camera.y, -camera.z);

                  VertexConsumerProvider consumers = context.consumers();

                  if (C.playerEsp) {
                      VertexConsumer lines = consumers.getBuffer(X_RAY_LINES);
                      float[] color = rgba(C.playerColor());

                      for (PlayerEntity target : client.world.getPlayers()) {
                          if (target == client.player
                                  || target.isSpectator()
                                  || !target.isAlive()) {
                              continue;
                          }

                          if (client.player.squaredDistanceTo(target)
                                  > (double) C.playerRange * C.playerRange) {
                              continue;
                          }

                          drawOutlinedBox(
                                  matrices,
                                  lines,
                                  target.getBoundingBox().expand(0.025),
                                  color,
                                  C.playerThickness);
                      }

                      flushLines(consumers);
                  }

                  if (C.blockEsp) {
                      VertexConsumer lines = consumers.getBuffer(X_RAY_LINES);
                      float[] color = rgba(C.blockColor());

                      for (BlockPos pos : ClientLogic.blockEspPositions()) {
                          drawOutlinedBox(
                                  matrices,
                                  lines,
                                  new Box(pos).expand(0.002),
                                  color,
                                  C.blockThickness);
                      }

                      flushLines(consumers);
                  }

                  if (C.stashEsp) {
                      VertexConsumer lines = consumers.getBuffer(X_RAY_LINES);
                      float[] color = rgba(C.stashColor());

                      for (BlockPos pos : ClientLogic.stashPositions()) {
                          drawOutlinedBox(
                                  matrices,
                                  lines,
                                  new Box(pos).expand(0.004),
                                  color,
                                  C.stashThickness);
                      }

                      flushLines(consumers);
                  }

                  matrices.pop();
              }

              private static void drawOutlinedBox(
                      MatrixStack matrices,
                      VertexConsumer lines,
                      Box box,
                      float[] color,
                      float width) {
                  MatrixStack.Entry matrix = matrices.peek();

                  double x0 = box.minX;
                  double y0 = box.minY;
                  double z0 = box.minZ;
                  double x1 = box.maxX;
                  double y1 = box.maxY;
                  double z1 = box.maxZ;

                  line(lines, matrix, x0, y0, z0, x1, y0, z0, color, width);
                  line(lines, matrix, x1, y0, z0, x1, y0, z1, color, width);
                  line(lines, matrix, x1, y0, z1, x0, y0, z1, color, width);
                  line(lines, matrix, x0, y0, z1, x0, y0, z0, color, width);

                  line(lines, matrix, x0, y1, z0, x1, y1, z0, color, width);
                  line(lines, matrix, x1, y1, z0, x1, y1, z1, color, width);
                  line(lines, matrix, x1, y1, z1, x0, y1, z1, color, width);
                  line(lines, matrix, x0, y1, z1, x0, y1, z0, color, width);

                  line(lines, matrix, x0, y0, z0, x0, y1, z0, color, width);
                  line(lines, matrix, x1, y0, z0, x1, y1, z0, color, width);
                  line(lines, matrix, x1, y0, z1, x1, y1, z1, color, width);
                  line(lines, matrix, x0, y0, z1, x0, y1, z1, color, width);
              }

              private static void line(
                      VertexConsumer consumer,
                      MatrixStack.Entry matrix,
                      double x0,
                      double y0,
                      double z0,
                      double x1,
                      double y1,
                      double z1,
                      float[] color,
                      float width) {
                  float w = Math.max(1.0f, Math.min(8.0f, width));

                  consumer.vertex(matrix, (float) x0, (float) y0, (float) z0)
                          .color(color[0], color[1], color[2], color[3])
                          .lineWidth(w);

                  consumer.vertex(matrix, (float) x1, (float) y1, (float) z1)
                          .color(color[0], color[1], color[2], color[3])
                          .lineWidth(w);
              }

              private static void flushLines(VertexConsumerProvider consumers) {
                  if (consumers instanceof VertexConsumerProvider.Immediate immediate) {
                      immediate.draw(X_RAY_LINES);
                  }
              }

              private static float[] rgba(int argb) {
                  return new float[] {
                          ((argb >> 16) & 0xFF) / 255.0f,
                          ((argb >> 8) & 0xFF) / 255.0f,
                          (argb & 0xFF) / 255.0f,
                          ((argb >>> 24) & 0xFF) / 255.0f
                  };
              }
          }
          JAVA

          cat > "$PROJECT_DIR/src/main/java/de/ragzan/utility/mixin/RenderPipelinesAccessor.java" <<'JAVA'
          package de.ragzan.utility.mixin;

          import com.mojang.blaze3d.pipeline.RenderPipeline;
          import net.minecraft.client.gl.RenderPipelines;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.gen.Accessor;
          import org.spongepowered.asm.mixin.gen.Invoker;

          @Mixin(RenderPipelines.class)
          public interface RenderPipelinesAccessor {
              @Invoker("register")
              static RenderPipeline ragzan$register(RenderPipeline pipeline) {
                  throw new AssertionError(
                          "Mixin invoker should be replaced at runtime");
              }

              @Accessor("RENDERTYPE_LINES_SNIPPET")
              static RenderPipeline.Snippet ragzan$linesSnippet() {
                  throw new AssertionError(
                          "Mixin accessor should be replaced at runtime");
              }
          }
          JAVA

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          project = Path(os.environ["PROJECT_DIR"])
          source = project / "src/main/java/de/ragzan/utility/ClientLogic.java"

          if not source.exists():
              raise SystemExit(f"Fehler: {source} wurde nicht gefunden")

          text = source.read_text(encoding="utf-8")

          text, count = re.subn(
              r'client\.world\.addEntity\([^;\n]*freecamEntity[^;\n]*\);',
              'client.world.addEntity(freecamEntity);',
              text,
          )

          source.write_text(text, encoding="utf-8")
          print(f"ClientLogic geprüft; addEntity-Aufrufe angepasst: {count}")
          PY

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.2.1'

      - name: Build mod
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle build --no-daemon

      - name: Verify mod JAR
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          JAR_FILE="$(find build/libs -maxdepth 1 \
            -type f -name '*.jar' \
            ! -name '*-sources.jar' | head -n 1)"

          if [ -z "$JAR_FILE" ]; then
            echo "Fehler: Keine Mod-JAR erzeugt." >&2
            exit 1
          fi

          jar tf "$JAR_FILE" > jar-contents.txt

          grep -qx 'fabric.mod.json' jar-contents.txt
          grep -qx 'de/ragzan/utility/RagzanUtilityClient.class' jar-contents.txt
          grep -qx 'de/ragzan/utility/gui/MainMenuScreen.class' jar-contents.txt

          echo "Mod-JAR geprüft: $JAR_FILE"

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: ragzan-utility-minecraft-1.21.11
          path: |
            ${{ steps.project.outputs.dir }}/build/libs/*.jar
            !${{ steps.project.outputs.dir }}/build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 14
